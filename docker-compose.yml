services:

  mysql:
    image: mysql:8
    container_name: franchise-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: franchise_db
    ports:
      - "3307:3306"

  app:
    build: .
    container_name: franchise-api
    depends_on:
      - mysql
    ports:
      - "8080:8080"